<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-labelledby="fq-hero-title">
  <title id="fq-hero-title">一位專注冒險者的書桌，桌上放著番茄鐘與經驗值徽章</title>
  <defs>
    <linearGradient id="fq-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241d52" />
      <stop offset="100%" stop-color="#140f30" />
    </linearGradient>
    <radialGradient id="fq-glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#f5b942" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f5b942" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="fq-tomato" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8a72" />
      <stop offset="100%" stop-color="#e8543f" />
    </linearGradient>
    <linearGradient id="fq-flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbd97a" />
      <stop offset="100%" stop-color="#f5b942" />
    </linearGradient>
    <linearGradient id="fq-desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2f6e" />
      <stop offset="100%" stop-color="#2a2258" />
    </linearGradient>
  </defs>

  <rect width="480" height="360" rx="24" fill="url(#fq-bg)" />
  <circle cx="240" cy="150" r="150" fill="url(#fq-glow)" />

  <!-- 星空點綴 -->
  <g fill="#f7f2e7" opacity="0.55">
    <circle cx="60" cy="48" r="2.2" />
    <circle cx="120" cy="90" r="1.6" />
    <circle cx="400" cy="60" r="2" />
    <circle cx="430" cy="120" r="1.4" />
    <circle cx="70" cy="150" r="1.4" />
    <circle cx="410" cy="200" r="1.8" />
  </g>

  <!-- 書桌 -->
  <path d="M40 300 L440 300 L410 340 L70 340 Z" fill="url(#fq-desk)" />
  <rect x="40" y="292" width="400" height="12" rx="6" fill="#4a3d86" />

  <!-- 攤開的筆記本 -->
  <g>
    <path d="M120 270 L235 262 L235 296 L120 300 Z" fill="#f7f2e7" opacity="0.92" />
    <path d="M235 262 L350 270 L350 300 L235 296 Z" fill="#e9e2d2" opacity="0.92" />
    <path d="M140 278 L215 273" stroke="#a39dc4" stroke-width="3" stroke-linecap="round" />
    <path d="M140 286 L205 282" stroke="#a39dc4" stroke-width="3" stroke-linecap="round" />
    <path d="M255 278 L330 283" stroke="#a39dc4" stroke-width="3" stroke-linecap="round" />
    <path d="M255 286 L320 290" stroke="#a39dc4" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- 經驗值進度環 -->
  <circle cx="240" cy="170" r="92" fill="none" stroke="#f7f2e7" stroke-opacity="0.08" stroke-width="10" />
  <circle
    cx="240"
    cy="170"
    r="92"
    fill="none"
    stroke="#f5b942"
    stroke-width="10"
    stroke-linecap="round"
    stroke-dasharray="578"
    stroke-dashoffset="165"
    transform="rotate(-90 240 170)"
  />

  <!-- 番茄鐘主體 -->
  <g transform="translate(240 172)">
    <path d="M-6 -78 C -6 -90 6 -90 6 -78 L 6 -66 L -6 -66 Z" fill="#6fbf8f" />
    <path d="M2 -80 C 18 -92 34 -84 30 -70 C 20 -74 10 -76 2 -68 Z" fill="#6fbf8f" />
    <circle r="66" fill="url(#fq-tomato)" />
    <circle r="66" fill="none" stroke="#e8543f" stroke-width="3" opacity="0.5" />
    <path d="M0 -66 L0 -50 M0 66 L0 50 M-66 0 L-50 0 M66 0 L50 0" stroke="#3a1712" stroke-width="3" stroke-linecap="round" opacity="0.35" />
    <circle r="6" fill="#3a1712" opacity="0.55" />
    <path d="M0 0 L0 -40" stroke="#3a1712" stroke-width="4" stroke-linecap="round" opacity="0.7" />
    <path d="M0 0 L26 10" stroke="#3a1712" stroke-width="4" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- 專注火焰 -->
  <g transform="translate(150 150)">
    <path
      d="M0 34 C -16 24 -18 4 -6 -8 C -10 4 -2 8 2 0 C 6 10 14 8 12 -4 C 22 4 20 26 0 34 Z"
      fill="url(#fq-flame)"
    />
  </g>

  <!-- 遠征徽章 -->
  <g transform="translate(372 96)">
    <path
      d="M0 -30 L26 -18 L26 8 C 26 26 12 36 0 42 C -12 36 -26 26 -26 8 L-26 -18 Z"
      fill="#f5b942"
      stroke="#caa257"
      stroke-width="2"
    />
    <path
      d="M0 -13 L5 -3 L16 -1 L8 7 L10 18 L0 13 L-10 18 L-8 7 L-16 -1 L-5 -3 Z"
      fill="#241d52"
    />
  </g>
</svg>
